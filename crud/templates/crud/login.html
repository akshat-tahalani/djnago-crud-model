{% extends 'crud/base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <div class="card">
        <h1 style="text-align: center; margin-top: 0;">🔐 Login</h1>
        
        {% if error %}
            <div style="padding: 12px; background: #f8d7da; border-radius: 6px; margin-bottom: 20px; color: #721c24; border-left: 4px solid #c3102b;">
                <strong>❌ Invalid Login</strong>
                <p style="margin: 8px 0 0 0;">{{ error }}</p>
            </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label for="username" style="display: block; margin-bottom: 8px; font-weight: bold;">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" 
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;"
                       required>
            </div>
            
            <div style="margin-bottom: 25px;">
                <label for="password" style="display: block; margin-bottom: 8px; font-weight: bold;">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" 
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;"
                       required>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; text-align: center; padding: 12px;">Login</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #666;">
            Don't have an account? <a href="/register/" style="color: #3498db; text-decoration: none;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
