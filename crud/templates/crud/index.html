{% extends 'crud/base.html' %}

{% block content %}
<h1 class="mb-4">All Courses</h1>

<div class="row">
    {% for course in courses %}
    <div class="col-md-4">        <!-- what number makes 3 columns? -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ course.name }}</h5>
                <p class="card-text">{{ course.description }}</p>
                <a href="/course/{{ course.id }}/" class="btn btn-primary">
                    View Course
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
